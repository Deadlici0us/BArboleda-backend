name: Build and Push to GHCR

on:
  push:
    branches: ['master']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image_name.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This stores your Docker layers so builds take seconds instead of minutes
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Lowercase the owner/repo so GHCR is the canonical lowercased path.
      # The job-level env.IMAGE_NAME is frozen at workflow start; we expose
      # the lowercased form as a step output and a job output for downstream
      # jobs (deploy) and other steps in this job.
      - name: Resolve lowercased image name
        id: image_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      # --- The Build Step ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # These two lines save you build minutes by reusing old layers
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Manual dispatch also deploys. The playbook always pulls :latest from GHCR;
    # the workflow_dispatch input is removed because the tag is pinned in the playbook.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: deploy.yml
          # We create a temporary inventory in-line
          inventory: |
            [vps]
            ${{ secrets.VPS_HOST }} ansible_port=${{ secrets.VPS_SSH_PORT }} ansible_user=${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          options: |
            --extra-vars "ansible_ssh_extra_args='-o StrictHostKeyChecking=no'"
            --extra-vars "mongo_uri=${{ secrets.MONGO_URI }}"
            --extra-vars "redis_host=${{ secrets.REDIS_HOST }}"
            --extra-vars "redis_port=${{ secrets.REDIS_PORT }}"
            --extra-vars "redis_password=${{ secrets.REDIS_PASSWORD }}"
            --extra-vars "redis_ssl=${{ secrets.REDIS_SSL }}"
